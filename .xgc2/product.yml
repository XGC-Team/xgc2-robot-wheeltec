schema: xgc2.product.v1
id: xgc2-wheeltec-onboard-ros1
name: XGC2 Wheeltec Onboard ROS1
version: 0.1.0-9
kind: ros1-apt
summary: ROS Melodic Wheeltec serial chassis and install-only autostart.
  Official swarm_ros_bridge comes from APT; field yaml is written by
  configure-network. LeiShen serial lidar is an optional published
  package, not part of the install set.
groups:
- robotics
- wheeltec
- onboard
ros:
  distro: melodic
  workspace: onboard/ros1
  packages:
  - turn_on_wheeltec_robot
  - wheeltec_onboard_autostart
  - wheeltec_onboard
  - lslidar_msgs
  - lslidar_driver
  - lslidar
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-wheeltec-onboard
  packages:
  - ros-melodic-xgc2-wheeltec-driver
  - ros-melodic-xgc2-wheeltec-onboard-autostart
  - ros-melodic-xgc2-wheeltec-onboard
  - ros-melodic-xgc2-wheeltec-lslidar-msgs
  - ros-melodic-xgc2-wheeltec-lslidar-driver
  - ros-melodic-xgc2-wheeltec-lslidar
  depends:
  - ros-melodic-geometry-msgs
  - ros-melodic-nav-msgs
  - ros-melodic-roscpp
  - ros-melodic-roslaunch
  - ros-melodic-sensor-msgs
  - ros-melodic-serial
  - ros-melodic-std-msgs
  - ros-melodic-swarm-ros-bridge (>= 1.1.0-12)
  - ros-melodic-tf
usage:
  install: |
    sudo apt update
    sudo apt install ros-melodic-xgc2-wheeltec-onboard
  smoke_test: |
    rospack find turn_on_wheeltec_robot
    roslaunch --files turn_on_wheeltec_robot wheeltec_robot.launch
    rospack find wheeltec_onboard_autostart
    roslaunch --files wheeltec_onboard_autostart chassis.launch
  notes: |
    Install set is chassis + autostart compose. Official swarm_ros_bridge
    is an APT Depends. Units are installed and not enabled. After install,
    enable chassis and swarm only. Lidar is optional
    ros-melodic-xgc2-wheeltec-lslidar and is not a hard Depends.
    configure-network.sh writes field peers to /etc/xgc2/wheeltec/ros_topics.yaml.
    Do not ship field yaml in a vehicle package.
ownership:
  paths:
  - /opt/ros/melodic/share/turn_on_wheeltec_robot
  - /opt/ros/melodic/lib/turn_on_wheeltec_robot/wheeltec_robot_node
  - /opt/ros/melodic/share/wheeltec_onboard_autostart
  - /opt/ros/melodic/share/wheeltec_onboard
  - /opt/ros/melodic/share/lslidar_driver
  - /opt/ros/melodic/share/lslidar_msgs
release:
  repository: lxk36/xgc2-robot-wheeltec
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  dependency_policy:
    xgc2-swarm-ros-bridge: verify
  apt_versions:
    bionic: 0.1.0-9
